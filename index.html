<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Tracker 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-bar">
        <h1>Year Tracker 2026</h1>
    </div>

    <div class="canvas-wrapper">
        <div class="canvas-area">
        
        <div id="name-training" class="name-block">training</div>
        <div id="box-training" class="circles-block">
            <div class="grid-container" id="grid-training"></div>
        </div>
        <div id="text-training" class="meta-text">0/156</div>

        <div id="name-films" class="name-block">films</div>
        <div id="box-films" class="circles-block">
            <div class="cinema-zone" id="cinema-zone">
                <svg class="cinema-border" viewBox="0 0 463 103" preserveAspectRatio="none" aria-hidden="true">
                    <rect x="1" y="1" width="461" height="101" rx="15" ry="15" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="2 2" />
                </svg>
                <div class="grid-container" id="grid-films-cinema"></div>
            </div>
            <span class="cinema-label" id="cinema-label">0/20 in the cinema</span>
            <div class="grid-container" id="grid-films-home"></div>
        </div>
        <div id="text-films" class="meta-text">0/50</div>

        <div id="name-english" class="name-block">english</div>
        <div id="box-english" class="circles-block">
            <div class="grid-container" id="grid-english"></div>
        </div>
        <div id="text-english" class="meta-text">0/80</div>

        <div id="name-squash" class="name-block">squash</div>
        <div id="box-squash" class="circles-block">
            <div class="grid-container" id="grid-squash"></div>
        </div>
        <div id="text-squash" class="meta-text">0/20</div>

        <div id="name-books" class="name-block">books</div>
        <div id="box-books" class="circles-block">
            <div class="grid-container" id="grid-books"></div>
        </div>
        <div id="text-books" class="meta-text">0/5</div>

        <div id="name-games" class="name-block">games</div>
        <div id="box-games" class="circles-block">
            <div class="grid-container" id="grid-games"></div>
        </div>
        <div id="text-games" class="meta-text">0/5</div>

        </div>
    </div>

    <div class="footer-bar">Copyright 2026 Year Tracker. All rights reserved. Created by Valentyn Korniienko.</div>


    <script src="script.js"></script>
</body>
</html>
